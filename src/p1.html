<title>Buzz人生シミュレーター</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: レトロな携帯ゲーム機の画面。上に情報バー、左にドット絵の部屋とできごとログ、右にタブパネル（スマホは縦積み＋下部タブ） */
:root{
  --bg:#191b37; --bg2:#20234a; --panel:#272b58; --panel2:#30356a; --line:#454c8c; --shadow:#0c0d26;
  --ink:#f4f1ff; --muted:#aca9d6; --btn:#363c78;
  --pink:#ff5c8a; --pink2:#ff93b2; --onpink:#2b0915;
  --cyan:#3fd6c9; --oncyan:#08221f; --gold:#ffcf3f; --red:#ff6150; --green:#7bdc6b; --purple:#b49cff;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg2)}
#app{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
button,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance}
.b{background:var(--btn);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--shadow);padding:8px 14px;cursor:pointer;line-height:1.35;text-align:center}
.b:hover:not(:disabled){border-color:var(--cyan)}
.b:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.b:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.b.pri{background:var(--pink);border-color:var(--pink2);color:var(--onpink)}
.b.on{background:var(--cyan);border-color:var(--cyan);color:var(--oncyan)}
.b.ghost{background:transparent;box-shadow:none}
.b.sm{padding:5px 10px;font-size:.85rem}
.b:disabled{opacity:.4;cursor:default}
select{background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:6px 8px;max-width:100%;min-width:0}
textarea{width:100%;background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:8px;font-size:.78rem;min-height:110px;word-break:break-all}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* タイトル */
.title{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:56px 40px;text-align:center}
.logo{display:flex;flex-direction:column;align-items:center;gap:10px}
#logoCv{width:240px;max-width:70vw;image-rendering:pixelated;aspect-ratio:160/80}
.logo h1{font-size:clamp(2rem,8.5vw,3.6rem);line-height:1.1;color:var(--gold);text-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--shadow);letter-spacing:.04em}
.tag{color:var(--muted);margin:0}
.tmenu{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.ver{color:var(--muted);font-size:.8rem;margin:0}

/* 上部バー */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg2);box-shadow:0 0 0 100vmax var(--bg2);clip-path:inset(0 -100vmax);border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:8px;margin-bottom:14px}
.ti{display:flex;align-items:baseline;gap:10px}
#tDate{font-size:1.05rem}
.age{color:var(--cyan)}
.tstats{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.money{color:var(--gold)}
.fol{color:var(--pink2)}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}

/* 本体 */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);grid-template-areas:"stage side" "log side";gap:14px;align-items:start}
.stage{grid-area:stage;display:flex;flex-direction:column;gap:10px;min-width:0}
.side{grid-area:side;display:flex;flex-direction:column;gap:0;min-width:0}
.logbox{grid-area:log;min-width:0;display:flex;flex-direction:column;gap:8px}
.roomwrap{position:relative;border:3px solid var(--line);background:#000;aspect-ratio:16/10;max-width:100%;box-shadow:5px 5px 0 var(--shadow)}
#room{width:100%;height:100%;display:block;image-rendering:pixelated}
#pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;font-size:1.1rem;color:var(--gold);text-shadow:2px 2px 0 #000;white-space:nowrap;animation:rise 1.6s ease-out forwards}
.pop.f{color:var(--pink2)}
.pop.bad{color:var(--red)}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-42px);opacity:0}}
.who{background:var(--panel);border:2px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.who .nm{font-size:1.15rem}
.who .sub{color:var(--muted);font-size:.82rem}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini div{display:flex;flex-direction:column;gap:2px;font-size:.78rem;color:var(--muted)}

.bar{height:8px;background:var(--shadow);border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan)}
.bar.h i{background:var(--green)} .bar.m i{background:var(--purple)} .bar.p i{background:var(--pink)} .bar.g i{background:var(--gold)}
.bars{display:grid;grid-template-columns:6.2em minmax(0,1fr) 2.6em;gap:6px 10px;align-items:center;font-size:.86rem}
.bars .v{text-align:right;font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:4px}
.tab{flex:1 1 0;min-width:0;background:var(--bg2);border:2px solid var(--line);border-bottom:none;color:var(--muted);padding:8px 4px;cursor:pointer;font-size:.86rem;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);border-color:var(--line);box-shadow:inset 0 3px 0 var(--pink)}
.panel{background:var(--panel);border:2px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px;min-height:360px;box-shadow:5px 5px 0 var(--shadow)}
.panel h2{font-size:1.1rem;color:var(--gold)}
.panel h3{font-size:.95rem;color:var(--cyan)}
.hint{color:var(--muted);font-size:.84rem;margin:0}
.grp{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.slot{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:8px;align-items:center}
.slot .lb{color:var(--muted);font-size:.82rem}
.slot select{width:100%}
.slot .ds{grid-column:2;color:var(--muted);font-size:.78rem;margin-top:-4px}
.fixed{background:var(--bg2);border:1px dashed var(--line);padding:6px 10px;font-size:.82rem;color:var(--muted)}
.card{background:var(--bg2);border:2px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.card.main{border-color:var(--pink)}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.big{font-size:1.25rem;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:.86rem}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:.74rem;padding:1px 8px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.chip.hot{border-color:var(--red);color:var(--red)}
.chip.up{border-color:var(--green);color:var(--green)}
.chip.dn{border-color:var(--red);color:var(--red)}
.shop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.shop:last-child{border-bottom:none}
.ppl{display:grid;grid-template-columns:minmax(0,1fr) 7em;gap:4px 12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ppl .r{font-size:.78rem;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:.84rem;max-height:260px;overflow:auto}
.tl li{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:8px}
.tl b{font-weight:400;color:var(--cyan);font-variant-numeric:tabular-nums}

.report{background:var(--panel);border:2px solid var(--line);padding:10px 12px;font-size:.84rem;display:flex;flex-direction:column;gap:4px}
.report .hd{color:var(--gold)}
.report .kv{font-size:.82rem}
.logbox h3{font-size:.9rem;color:var(--muted)}
#log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:320px;overflow:auto;font-size:.84rem}
#log li{background:var(--bg2);border-left:3px solid var(--line);padding:4px 8px}
#log li.good{border-left-color:var(--green)} #log li.bad{border-left-color:var(--red)} #log li.sns{border-left-color:var(--pink)} #log li.life{border-left-color:var(--gold)}
#log .d{color:var(--muted);font-size:.74rem;margin-right:6px}

/* モーダル */
.ov{position:fixed;inset:0;background:rgba(8,9,28,.76);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mcard{background:var(--panel);border:3px solid var(--gold);max-width:560px;width:100%;max-height:100%;overflow:auto;padding:20px;box-shadow:7px 7px 0 var(--shadow);display:flex;flex-direction:column;gap:12px}
.mcat{font-size:.78rem;color:var(--onpink);background:var(--pink);align-self:flex-start;padding:1px 10px}
.mcat.life{background:var(--gold);color:#2b2000}
.mcard h2{font-size:1.3rem;color:var(--gold)}
.mtext{white-space:pre-line;margin:0}
.mch{display:flex;flex-direction:column;gap:8px}
.mch .b{text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:6px}
@media (prefers-reduced-motion: no-preference){.mcard{animation:popin .18s ease-out}@keyframes popin{from{transform:scale(.96)}to{transform:none}}}
@media (prefers-reduced-motion: reduce){.pop{animation-duration:.01s}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--gold);color:#2b2000;padding:8px 16px;z-index:60;font-size:.9rem;max-width:calc(100% - 32px);text-align:center}

/* エンディング */
.end{display:flex;flex-direction:column;gap:16px;padding-block:28px 40px;max-width:820px;margin:0 auto}
.end .head{display:flex;flex-direction:column;gap:6px;text-align:center}
.end h1{font-size:clamp(1.6rem,6vw,2.4rem);color:var(--gold)}
.ttl{align-self:center;background:var(--pink);color:var(--onpink);padding:3px 14px;font-size:1.05rem}
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.egrid .card span{color:var(--muted);font-size:.8rem}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.charts canvas{width:100%;height:auto;display:block;background:var(--bg2);border:2px solid var(--line)}
.share img{width:100%;max-width:600px;display:block;margin:0 auto;border:2px solid var(--line)}
.credit{font-size:.84rem;display:flex;flex-direction:column;gap:6px}
.credit ul{margin:0;padding-left:1.2em}
.form{display:flex;flex-direction:column;gap:10px}
.fld{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:8px;align-items:center;font-size:.9rem}
.fld span{color:var(--muted)}
.fld input{background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:6px 8px;min-width:0;width:100%;font:inherit}
.fld input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#townCv{width:100%;max-width:520px;aspect-ratio:4/3;image-rendering:pixelated;border:3px solid var(--line);cursor:pointer;display:block;box-shadow:4px 4px 0 var(--shadow)}
.achl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:300px;overflow:auto}
.ach{background:var(--bg2);border:1px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;gap:2px;font-size:.78rem;color:var(--muted)}
.ach b{font-weight:400;color:var(--muted)}
.ach.got{border-color:var(--gold)}
.ach.got b{color:var(--gold)}
.tab{position:relative}
.badge{position:absolute;top:-6px;right:-4px;background:var(--red);color:#fff;font-size:.66rem;line-height:1;padding:3px 5px;border-radius:9px;min-width:16px;text-align:center}
.stab .badge{position:static;margin-left:6px;display:inline-block}
.tabhint{margin:0;color:var(--muted);font-size:.8rem;border-left:3px solid var(--cyan);padding-left:8px}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:8px}
.stab{background:var(--bg2);border:2px solid var(--line);color:var(--muted);padding:6px 12px;cursor:pointer;font:inherit;font-size:.86rem}
.stab[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:var(--oncyan)}
.stab:focus-visible,.seg button:focus-visible,.note:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.notes{display:flex;flex-direction:column;gap:6px}
.note{display:block;width:100%;text-align:left;background:var(--bg2);border:2px solid var(--gold);color:var(--ink);padding:8px 10px;font:inherit;font-size:.86rem;cursor:pointer}
.note.bad{border-color:var(--red)}
div.note{cursor:default}
.slotc{background:var(--bg2);border:1px solid var(--line);padding:8px 10px;display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:4px 8px;align-items:center}
.slotc .lb{color:var(--muted);font-size:.82rem}
.sel2{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.sel2 select{flex:1 1 9em;min-width:0}
.slotc .ds{grid-column:2;margin:0;color:var(--muted);font-size:.78rem}
.seg{display:inline-flex;flex-wrap:wrap;gap:0;align-items:center}
.seg button{background:var(--bg);border:2px solid var(--line);color:var(--ink);padding:4px 10px;font:inherit;font-size:.8rem;cursor:pointer;margin-right:-2px}
.seg button.on{background:var(--pink);border-color:var(--pink);color:var(--onpink);position:relative;z-index:1}
.seg button:disabled{opacity:.4;cursor:default}
.seg .cnt{padding:0 12px;font-weight:400;font-variant-numeric:tabular-nums}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.84rem}
.ctl>span:first-child{width:5.5em;color:var(--muted)}
.stars{color:var(--gold);letter-spacing:.05em}
.kv .up{color:var(--green)} .kv .dn{color:var(--red)}
.big2{font-size:1rem}
.vol{display:flex;flex-direction:column;gap:6px}
.vol input[type=range]{width:100%;accent-color:var(--pink)}
.card.warn{border-color:var(--red)}
a.b{display:inline-block;text-decoration:none;align-self:flex-start}
.tnews{position:relative}
.news{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow:auto}
.nv{background:var(--bg2);border:1px solid var(--line);padding:8px 12px}
.nv.cur{border-color:var(--gold)}
.nv .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.nv b{font-weight:400;color:var(--gold);font-size:1.05rem}
.nv ul{margin:6px 0 0;padding-left:1.2em;font-size:.85rem;display:flex;flex-direction:column;gap:3px}
.b.danger{background:var(--red);border-color:var(--red);color:#2a0500}

@media (max-width:860px){
  .cols{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "side" "log"}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg2);border-top:2px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:3px}
  .tab{border:2px solid var(--line);font-size:.86rem;padding:9px 0}
  .tab[aria-selected="true"]{box-shadow:inset 0 -3px 0 var(--pink)}
  #app{padding-block:0 92px}
  .ctrl{margin-left:0;width:100%}
  .ctrl .b{flex:1 1 auto}
  .panel{min-height:0}
}
.ticker{overflow:hidden;white-space:nowrap;background:var(--bg2);border-bottom:2px solid var(--line);color:var(--gold);font-size:13px;padding:3px 0}
.ticker span{display:inline-block;padding-left:100%}
@media (prefers-reduced-motion: no-preference){.ticker span{animation:tick 38s linear infinite}@keyframes tick{to{transform:translateX(-100%)}}}
@media (prefers-reduced-motion: reduce){.ticker span{padding-left:8px;white-space:normal}}
.fanbar{display:flex;height:12px;border:2px solid var(--line);background:var(--bg2);margin:4px 0}
.fanbar i{display:block;height:100%}.fanbar .c{background:var(--pink)}.fanbar .l{background:var(--cyan)}.fanbar .a{background:var(--red)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.album figure{margin:0;background:var(--panel2);border:2px solid var(--line);padding:6px}
.album canvas{width:100%;image-rendering:pixelated;display:block;background:var(--bg2)}
.album figcaption{font-size:12px;margin-top:4px;line-height:1.4}
#relMap{width:100%;max-width:360px;display:block;margin:6px auto;border:2px solid var(--line)}
#mvReg,#mvCty,#goalSel{max-width:100%}
.tabhint .hbtn{margin-left:8px;vertical-align:middle}
.mtext.guide{white-space:pre-line;line-height:1.7}
</style>

<div id="app">
  <section id="scrTitle" class="title">
    <div class="logo">
      <canvas id="logoCv" width="160" height="80" aria-hidden="true"></canvas>
      <h1 id="gameTitle">Buzz<br>人生シミュレーター</h1>
      <p class="tag">生まれは選べない。バズるかどうかは、きみ次第。</p>
    </div>
    <div class="tmenu">
      <button class="b pri" id="btnNew" type="button">はじめから（ランダムに生まれる）</button>
      <button class="b" id="btnCont" type="button">つづきから</button>
      <button class="b" id="btnImport" type="button">セーブデータを読み込む</button>
      <button class="b" type="button" data-act="achv">実績・図鑑</button>
      <button class="b" type="button" data-act="guide">遊び方</button>
      <button class="b" type="button" data-act="settings">設定（音量）</button>
      <button class="b" type="button" data-act="delMenu">セーブデータを消す</button>
      <button class="b tnews" type="button" data-act="news">アップデート情報</button>
      <button class="b" type="button" data-act="versions">ほかのバージョンで遊ぶ</button>
      <button class="b ghost" id="btnCredit" type="button">出典・クレジット</button>
    </div>
    <p class="ver">試作版 v0.3.2 ／ お金の支払い・お店の経営・行動の中身・音量調整を追加</p>
  </section>

  <section id="scrGame" hidden>
    <header class="top">
      <div class="ti"><span id="tDate"></span><span id="tAge" class="age"></span></div>
      <div class="tstats"><span class="money" id="tMoney"></span><span class="fol" id="tFol"></span></div>
      <div class="ctrl" id="ctrl">
        <button class="b sm" type="button" data-spd="0">停止</button>
        <button class="b sm" type="button" data-spd="1">▶</button>
        <button class="b sm" type="button" data-spd="2">▶▶</button>
        <button class="b sm" type="button" data-spd="4">▶▶▶</button>
        <button class="b sm pri" type="button" id="btnNext">次へ</button>
        <button class="b sm" type="button" id="btnSkip">イベントまで</button>
        <button class="b sm" type="button" id="btnBgm">BGM ON</button>
        <button class="b sm ghost" type="button" id="btnMenu">メニュー</button>
      </div>
    </header>
    <div class="ticker" id="ticker" hidden aria-live="off"><span></span></div>
    <main class="cols">
      <div class="stage">
        <div class="roomwrap"><canvas id="room" width="160" height="100" aria-label="主人公の部屋"></canvas><div id="pops"></div></div>
        <div class="who" id="who"></div>
      </div>
      <div class="side">
        <nav class="tabs" id="tabs" role="tablist">
          <button class="tab" role="tab" type="button" data-tab="act">予定</button>
          <button class="tab" role="tab" type="button" data-tab="sns">発信</button>
          <button class="tab" role="tab" type="button" data-tab="money">お金</button>
          <button class="tab" role="tab" type="button" data-tab="biz">事業</button>
          <button class="tab" role="tab" type="button" data-tab="life">人生</button>
        </nav>
        <div class="panel" id="panel" role="tabpanel"></div>
      </div>
      <div class="logbox">
        <div class="report" id="report"></div>
        <h3>できごと</h3>
        <ol id="log"></ol>
      </div>
    </main>
  </section>
