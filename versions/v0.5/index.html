<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#20234a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Buzz人生">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="../../icon-192.png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
</head>
<body>
<div style="position:relative;z-index:40;background:#ffcf3f;color:#2b2000;font:14px/1.5 system-ui,sans-serif;padding:8px max(16px,env(safe-area-inset-left,0px));text-align:center">これは過去のバージョン v0.5 です（セーブは最新版とは別に保存されます） ／ <a href="../../" style="color:#2b2000;font-weight:bold">最新版に戻る</a></div>
<title>Buzz人生シミュレーター</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: レトロな携帯ゲーム機の画面。上に情報バー、左にドット絵の部屋とできごとログ、右にタブパネル（スマホは縦積み＋下部タブ） */
:root{
  --bg:#191b37; --bg2:#20234a; --panel:#272b58; --panel2:#30356a; --line:#454c8c; --shadow:#0c0d26;
  --ink:#f4f1ff; --muted:#aca9d6; --btn:#363c78;
  --pink:#ff5c8a; --pink2:#ff93b2; --onpink:#2b0915;
  --cyan:#3fd6c9; --oncyan:#08221f; --gold:#ffcf3f; --red:#ff6150; --green:#7bdc6b; --purple:#b49cff;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg2)}
#app{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
button,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance}
.b{background:var(--btn);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--shadow);padding:8px 14px;cursor:pointer;line-height:1.35;text-align:center}
.b:hover:not(:disabled){border-color:var(--cyan)}
.b:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.b:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.b.pri{background:var(--pink);border-color:var(--pink2);color:var(--onpink)}
.b.on{background:var(--cyan);border-color:var(--cyan);color:var(--oncyan)}
.b.ghost{background:transparent;box-shadow:none}
.b.sm{padding:5px 10px;font-size:.85rem}
.b:disabled{opacity:.4;cursor:default}
select{background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:6px 8px;max-width:100%;min-width:0}
textarea{width:100%;background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:8px;font-size:.78rem;min-height:110px;word-break:break-all}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* タイトル */
.title{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:56px 40px;text-align:center}
.logo{display:flex;flex-direction:column;align-items:center;gap:10px}
#logoCv{width:240px;max-width:70vw;image-rendering:pixelated;aspect-ratio:160/80}
.logo h1{font-size:clamp(2rem,8.5vw,3.6rem);line-height:1.1;color:var(--gold);text-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--shadow);letter-spacing:.04em}
.tag{color:var(--muted);margin:0}
.tmenu{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.ver{color:var(--muted);font-size:.8rem;margin:0}

/* 上部バー */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg2);box-shadow:0 0 0 100vmax var(--bg2);clip-path:inset(0 -100vmax);border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:8px;margin-bottom:14px}
.ti{display:flex;align-items:baseline;gap:10px}
#tDate{font-size:1.05rem}
.age{color:var(--cyan)}
.tstats{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.money{color:var(--gold)}
.fol{color:var(--pink2)}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}

/* 本体 */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);grid-template-areas:"stage side" "log side";gap:14px;align-items:start}
.stage{grid-area:stage;display:flex;flex-direction:column;gap:10px;min-width:0}
.side{grid-area:side;display:flex;flex-direction:column;gap:0;min-width:0}
.logbox{grid-area:log;min-width:0;display:flex;flex-direction:column;gap:8px}
.roomwrap{position:relative;border:3px solid var(--line);background:#000;aspect-ratio:16/10;max-width:100%;box-shadow:5px 5px 0 var(--shadow)}
#room{width:100%;height:100%;display:block;image-rendering:pixelated}
#pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;font-size:1.1rem;color:var(--gold);text-shadow:2px 2px 0 #000;white-space:nowrap;animation:rise 1.6s ease-out forwards}
.pop.f{color:var(--pink2)}
.pop.bad{color:var(--red)}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-42px);opacity:0}}
.who{background:var(--panel);border:2px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.who .nm{font-size:1.15rem}
.who .sub{color:var(--muted);font-size:.82rem}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini div{display:flex;flex-direction:column;gap:2px;font-size:.78rem;color:var(--muted)}

.bar{height:8px;background:var(--shadow);border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan)}
.bar.h i{background:var(--green)} .bar.m i{background:var(--purple)} .bar.p i{background:var(--pink)} .bar.g i{background:var(--gold)}
.bars{display:grid;grid-template-columns:6.2em minmax(0,1fr) 2.6em;gap:6px 10px;align-items:center;font-size:.86rem}
.bars .v{text-align:right;font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:4px}
.tab{flex:1 1 0;min-width:0;background:var(--bg2);border:2px solid var(--line);border-bottom:none;color:var(--muted);padding:8px 4px;cursor:pointer;font-size:.86rem;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);border-color:var(--line);box-shadow:inset 0 3px 0 var(--pink)}
.panel{background:var(--panel);border:2px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px;min-height:360px;box-shadow:5px 5px 0 var(--shadow)}
.panel h2{font-size:1.1rem;color:var(--gold)}
.panel h3{font-size:.95rem;color:var(--cyan)}
.hint{color:var(--muted);font-size:.84rem;margin:0}
.grp{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.slot{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:8px;align-items:center}
.slot .lb{color:var(--muted);font-size:.82rem}
.slot select{width:100%}
.slot .ds{grid-column:2;color:var(--muted);font-size:.78rem;margin-top:-4px}
.fixed{background:var(--bg2);border:1px dashed var(--line);padding:6px 10px;font-size:.82rem;color:var(--muted)}
.card{background:var(--bg2);border:2px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.card.main{border-color:var(--pink)}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.big{font-size:1.25rem;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:.86rem}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:.74rem;padding:1px 8px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.chip.hot{border-color:var(--red);color:var(--red)}
.chip.up{border-color:var(--green);color:var(--green)}
.chip.dn{border-color:var(--red);color:var(--red)}
.shop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.shop:last-child{border-bottom:none}
.ppl{display:grid;grid-template-columns:minmax(0,1fr) 7em;gap:4px 12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ppl .r{font-size:.78rem;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:.84rem;max-height:260px;overflow:auto}
.tl li{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:8px}
.tl b{font-weight:400;color:var(--cyan);font-variant-numeric:tabular-nums}

.report{background:var(--panel);border:2px solid var(--line);padding:10px 12px;font-size:.84rem;display:flex;flex-direction:column;gap:4px}
.report .hd{color:var(--gold)}
.report .kv{font-size:.82rem}
.logbox h3{font-size:.9rem;color:var(--muted)}
#log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:320px;overflow:auto;font-size:.84rem}
#log li{background:var(--bg2);border-left:3px solid var(--line);padding:4px 8px}
#log li.good{border-left-color:var(--green)} #log li.bad{border-left-color:var(--red)} #log li.sns{border-left-color:var(--pink)} #log li.life{border-left-color:var(--gold)}
#log .d{color:var(--muted);font-size:.74rem;margin-right:6px}

/* モーダル */
.ov{position:fixed;inset:0;background:rgba(8,9,28,.76);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mcard{background:var(--panel);border:3px solid var(--gold);max-width:560px;width:100%;max-height:100%;overflow:auto;padding:20px;box-shadow:7px 7px 0 var(--shadow);display:flex;flex-direction:column;gap:12px}
.mcat{font-size:.78rem;color:var(--onpink);background:var(--pink);align-self:flex-start;padding:1px 10px}
.mcat.life{background:var(--gold);color:#2b2000}
.mcard h2{font-size:1.3rem;color:var(--gold)}
.mtext{white-space:pre-line;margin:0}
.mch{display:flex;flex-direction:column;gap:8px}
.mch .b{text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:6px}
@media (prefers-reduced-motion: no-preference){.mcard{animation:popin .18s ease-out}@keyframes popin{from{transform:scale(.96)}to{transform:none}}}
@media (prefers-reduced-motion: reduce){.pop{animation-duration:.01s}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--gold);color:#2b2000;padding:8px 16px;z-index:60;font-size:.9rem;max-width:calc(100% - 32px);text-align:center}

/* エンディング */
.end{display:flex;flex-direction:column;gap:16px;padding-block:28px 40px;max-width:820px;margin:0 auto}
.end .head{display:flex;flex-direction:column;gap:6px;text-align:center}
.end h1{font-size:clamp(1.6rem,6vw,2.4rem);color:var(--gold)}
.ttl{align-self:center;background:var(--pink);color:var(--onpink);padding:3px 14px;font-size:1.05rem}
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.egrid .card span{color:var(--muted);font-size:.8rem}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.charts canvas{width:100%;height:auto;display:block;background:var(--bg2);border:2px solid var(--line)}
.share img{width:100%;max-width:600px;display:block;margin:0 auto;border:2px solid var(--line)}
.credit{font-size:.84rem;display:flex;flex-direction:column;gap:6px}
.credit ul{margin:0;padding-left:1.2em}
.form{display:flex;flex-direction:column;gap:10px}
.fld{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:8px;align-items:center;font-size:.9rem}
.fld span{color:var(--muted)}
.fld input{background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:6px 8px;min-width:0;width:100%;font:inherit}
.fld input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#townCv{width:100%;max-width:520px;aspect-ratio:4/3;image-rendering:pixelated;border:3px solid var(--line);cursor:pointer;display:block;box-shadow:4px 4px 0 var(--shadow)}
.achl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:300px;overflow:auto}
.ach{background:var(--bg2);border:1px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;gap:2px;font-size:.78rem;color:var(--muted)}
.ach b{font-weight:400;color:var(--muted)}
.ach.got{border-color:var(--gold)}
.ach.got b{color:var(--gold)}
.tab{position:relative}
.badge{position:absolute;top:-6px;right:-4px;background:var(--red);color:#fff;font-size:.66rem;line-height:1;padding:3px 5px;border-radius:9px;min-width:16px;text-align:center}
.stab .badge{position:static;margin-left:6px;display:inline-block}
.tabhint{margin:0;color:var(--muted);font-size:.8rem;border-left:3px solid var(--cyan);padding-left:8px}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:8px}
.stab{background:var(--bg2);border:2px solid var(--line);color:var(--muted);padding:6px 12px;cursor:pointer;font:inherit;font-size:.86rem}
.stab[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:var(--oncyan)}
.stab:focus-visible,.seg button:focus-visible,.note:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.notes{display:flex;flex-direction:column;gap:6px}
.note{display:block;width:100%;text-align:left;background:var(--bg2);border:2px solid var(--gold);color:var(--ink);padding:8px 10px;font:inherit;font-size:.86rem;cursor:pointer}
.note.bad{border-color:var(--red)}
div.note{cursor:default}
.slotc{background:var(--bg2);border:1px solid var(--line);padding:8px 10px;display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:4px 8px;align-items:center}
.slotc .lb{color:var(--muted);font-size:.82rem}
.sel2{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.sel2 select{flex:1 1 9em;min-width:0}
.slotc .ds{grid-column:2;margin:0;color:var(--muted);font-size:.78rem}
.seg{display:inline-flex;flex-wrap:wrap;gap:0;align-items:center}
.seg button{background:var(--bg);border:2px solid var(--line);color:var(--ink);padding:4px 10px;font:inherit;font-size:.8rem;cursor:pointer;margin-right:-2px}
.seg button.on{background:var(--pink);border-color:var(--pink);color:var(--onpink);position:relative;z-index:1}
.seg button:disabled{opacity:.4;cursor:default}
.seg .cnt{padding:0 12px;font-weight:400;font-variant-numeric:tabular-nums}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.84rem}
.ctl>span:first-child{width:5.5em;color:var(--muted)}
.stars{color:var(--gold);letter-spacing:.05em}
.kv .up{color:var(--green)} .kv .dn{color:var(--red)}
.big2{font-size:1rem}
.vol{display:flex;flex-direction:column;gap:6px}
.vol input[type=range]{width:100%;accent-color:var(--pink)}
.card.warn{border-color:var(--red)}
a.b{display:inline-block;text-decoration:none;align-self:flex-start}
.tnews{position:relative}
.news{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow:auto}
.nv{background:var(--bg2);border:1px solid var(--line);padding:8px 12px}
.nv.cur{border-color:var(--gold)}
.nv .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.nv b{font-weight:400;color:var(--gold);font-size:1.05rem}
.nv ul{margin:6px 0 0;padding-left:1.2em;font-size:.85rem;display:flex;flex-direction:column;gap:3px}
.b.danger{background:var(--red);border-color:var(--red);color:#2a0500}

@media (max-width:860px){
  .cols{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "side" "log"}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg2);border-top:2px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:3px}
  .tab{border:2px solid var(--line);font-size:.86rem;padding:9px 0}
  .tab[aria-selected="true"]{box-shadow:inset 0 -3px 0 var(--pink)}
  #app{padding-block:0 92px}
  .ctrl{margin-left:0;width:100%}
  .ctrl .b{flex:1 1 auto}
  .panel{min-height:0}
}
</style>

<div id="app">
  <section id="scrTitle" class="title">
    <div class="logo">
      <canvas id="logoCv" width="160" height="80" aria-hidden="true"></canvas>
      <h1 id="gameTitle">Buzz<br>人生シミュレーター</h1>
      <p class="tag">生まれは選べない。バズるかどうかは、きみ次第。</p>
    </div>
    <div class="tmenu">
      <button class="b pri" id="btnNew" type="button">はじめから（ランダムに生まれる）</button>
      <button class="b" id="btnCont" type="button">つづきから</button>
      <button class="b" id="btnImport" type="button">セーブデータを読み込む</button>
      <button class="b" type="button" data-act="achv">実績・図鑑</button>
      <button class="b" type="button" data-act="settings">設定（音量）</button>
      <button class="b" type="button" data-act="delMenu">セーブデータを消す</button>
      <button class="b tnews" type="button" data-act="news">アップデート情報</button>
      <button class="b" type="button" data-act="versions">ほかのバージョンで遊ぶ</button>
      <button class="b ghost" id="btnCredit" type="button">出典・クレジット</button>
    </div>
    <p class="ver">試作版 v0.3.2 ／ お金の支払い・お店の経営・行動の中身・音量調整を追加</p>
  </section>

  <section id="scrGame" hidden>
    <header class="top">
      <div class="ti"><span id="tDate"></span><span id="tAge" class="age"></span></div>
      <div class="tstats"><span class="money" id="tMoney"></span><span class="fol" id="tFol"></span></div>
      <div class="ctrl" id="ctrl">
        <button class="b sm" type="button" data-spd="0">停止</button>
        <button class="b sm" type="button" data-spd="1">▶</button>
        <button class="b sm" type="button" data-spd="2">▶▶</button>
        <button class="b sm" type="button" data-spd="4">▶▶▶</button>
        <button class="b sm pri" type="button" id="btnNext">次へ</button>
        <button class="b sm" type="button" id="btnSkip">イベントまで</button>
        <button class="b sm" type="button" id="btnBgm">BGM ON</button>
        <button class="b sm ghost" type="button" id="btnMenu">メニュー</button>
      </div>
    </header>
    <main class="cols">
      <div class="stage">
        <div class="roomwrap"><canvas id="room" width="160" height="100" aria-label="主人公の部屋"></canvas><div id="pops"></div></div>
        <div class="who" id="who"></div>
      </div>
      <div class="side">
        <nav class="tabs" id="tabs" role="tablist">
          <button class="tab" role="tab" type="button" data-tab="act">予定</button>
          <button class="tab" role="tab" type="button" data-tab="sns">発信</button>
          <button class="tab" role="tab" type="button" data-tab="money">お金</button>
          <button class="tab" role="tab" type="button" data-tab="biz">事業</button>
          <button class="tab" role="tab" type="button" data-tab="life">人生</button>
        </nav>
        <div class="panel" id="panel" role="tabpanel"></div>
      </div>
      <div class="logbox">
        <div class="report" id="report"></div>
        <h3>できごと</h3>
        <ol id="log"></ol>
      </div>
    </main>
  </section>

  <section id="scrEnd" class="end" hidden></section>
</div>
<div id="modal" class="ov" hidden><div class="mcard" id="mcard" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>
<script>
// ===== 設定・基本ヘルパー =====
// ゲーム名・国名はここだけで管理（開発者が変更する場所）

let S=null, DL=null;

const pn=n=>n?(n.name.split(' ')[1]||n.name):'';
function totalF(){let t=0;for(const k in S.f)if(S.open[k])t+=S.f[k];return t}
function newMo(){return {inc:{},out:{},views:0,newF:0,posts:0,buzz:0,flame:0}}
function inc(cat,v){if(!v)return;S.money+=v;S.mo.inc[cat]=(S.mo.inc[cat]||0)+v;if(['sns','deal','tip'].includes(cat))S.yInc+=v}
function outc(cat,v){if(!v)return;S.money-=v;S.mo.out[cat]=(S.mo.out[cat]||0)+v}
function ad(k,v,cat){
  if(!v)return;
  if(k in P_KEYS)S.p[k]=clamp(S.p[k]+v);
  else if(k in SK_KEYS)S.sk[k]=clamp(S.sk[k]+v);
  else if(k==='money'){if(v>0)inc(cat||'ev',v);else outc(cat||'ev',-v)}
  else if(k==='f'){const key=S.open[S.main]?S.main:'milu';if(!S.open[key])return;S.f[key]=Math.max(0,S.f[key]+v)}
  else if(k.startsWith('tal.')){const t=k.slice(4);S.tal[t]=clamp(S.tal[t]+v)}
  if(DL)DL[k]=(DL[k]||0)+v;
}
function rel(n,v){if(!n)return;n.rel=clamp(n.rel+v);if(DL){const k='rel:'+pn(n);DL[k]=(DL[k]||0)+v}}
function parents(){return [S.fam.fa,S.fam.mo].filter(p=>p&&p.alive)}
function relP(v){for(const p of parents())rel(p,v)}
function parentName(){const p=parents();return p.length?pick(p).role:'家族'}
function anyParentAlive(){return parents().length>0}
function oldParent(){return pick(parents())}
function lover(){return S.spouse||S.partner}
function relKc(v){rel(S.kc.by==='父'?S.fam.fa:S.fam.mo,v)}
function tl(t){S.tl.push([age(),t])}
function log(t,kind){S.log.unshift([`${S.y}/${S.m}`,t,kind||'']);if(S.log.length>80)S.log.length=80}
function mkNpc(role){const g=chance(.5)?'男':'女';return {id:'n'+RI(1000,9999),name:pick(SURN)+' '+pick(g==='男'?NAME_M:NAME_F),role,trait:pick(NPC_TRAITS),rel:RI(35,55),g}}
function openSns(k){S.open[k]=1;S.snsOpen=1}
function topTal(){return Object.keys(S.tal).sort((a,b)=>S.tal[b]-S.tal[a])[0]}
function livingCost(){const base=S.region.cost*(S.priceIdx||1);return Math.round(base*(S.spouse?1.6:1))}
function kidChLikely(){return S.kc.likely}
function startKidCh(){const ps=parents();const by=ps.find(p=>p.trait==='目立ちたがり')||pick(ps);if(!by)return;S.kc.on=1;S.kc.f=RI(20,200);S.kc.by=by.role;S.kc.byName=by.role;tl('家族チャンネルが始まった')}
function lessonOptions(){const lim=[0,7000,12000,20000,30000][S.tier];return Object.keys(LESSONS).filter(k=>LESSONS[k].cost<=lim)}
function convertTalent(){const t=S.tal,k=S.sk;k.talk=clamp(k.talk+t.talk*.25+t.comedy*.12);k.plan=clamp(k.plan+t.comedy*.15+t.study*.12+t.game*.1);k.edit=clamp(k.edit+t.vlog*.2+t.game*.12+(S.flags.phone?5:0));k.looks=clamp(k.looks+t.beauty*.25+t.music*.08)}
function makeOffers(edu,mid){
  let base=edu==='大卒'?237000:187000;
  if(mid)base*=1+Math.min(.6,Math.max(0,age()-22)*.02);
  const ok=JOBS.filter(j=>S.p.know>=j.need&&(!j.uni||edu==='大卒')&&(!j.soc||S.p.social>=j.soc));
  const out=[];const pool=ok.slice();
  while(out.length<3&&pool.length){const j=pool.splice(RI(0,pool.length-1),1)[0];out.push({n:j.n,sal:Math.round(base*j.m*S.region.sal*R(.96,1.04)/1000)*1000})}
  return out;
}
function offersCh(edu){
  const o=S.offers||[];
  return o.map(j=>[`${j.n}（月給 ${num(j.sal)}円）`,()=>{S.st='work';S.job=j.n;S.salary=j.sal;S.edu=edu;S.offers=null;delete S.flags.ronin;tl(j.n+'として就職');ad('happy',3);return `${j.n}として働き始めた。毎月${num(j.sal)}円の給料が入る。仕事の時間は自動で使われる。`}]);
}
function wed(c,h){ad('money',-c);ad('happy',h);S.spouse=S.partner;S.spouse.role='配偶者';S.spouse.inc=RI(14,28)*10000;S.partner=null;S.indep=1;tl(S.spouse.name+'と結婚した');return 'ふたりの新しい生活が始まった。家計はふたりで支え合う。'}
function divorce(){tl(S.spouse.name+'と離婚した');S.spouse=null;ad('happy',-12);ad('mental',-8);ad('money',-Math.round(Math.max(0,S.money)*.3),'loss');return '離婚が成立した。財産の一部を分けた。'}

function bgmPlay(name){
  if(!bgmOn){bgmStop();return}
  if(bgmCur===name)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}

  for(const tok of tr.mel.split(/\s+/)){const [n,l]=tok.split('.');if(n!=='-')evs.push({s:st,f:nf(n),l:+l,k:'m'});st+=+l}

function note(e,t,sd,out,w){
  const g=AC.createGain();g.connect(out);

  if(e.k==='k'){o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.start(t);o.stop(t+.16);return}

  lesson:{n:'習い事',d:'習い事に関係する素質が大きく伸びる',ok:()=>age()>=6&&age()<18&&!!S.lesson,f:k=>{const l=LESSONS[S.lesson];for(const t of l.tal)ad('tal.'+t,3.2*k/l.tal.length*1.3);if(l.know)ad('know',1.6*k);if(l.health)ad('health',2*k);ad('happy',.4*k)}},

  family:{n:'家族と過ごす',d:'家族との仲と幸福が上がる',ok:()=>age()>=6,f:k=>{relP(2*k);for(const s of S.sibs)rel(s,1*k);if(S.spouse)rel(S.spouse,2*k);ad('happy',1.5*k)}}
};
function freeSlots(){const a=age();if(a<6)return 0;let n=({school:2,univ:3,work:2,creator:4,free:4,retired:4})[S.st]||2;if(S.st==='school'&&S.flags.hs==='online'&&a>=15)n++;if(S.flags.care&&S.am<S.flags.care)n--;return Math.max(1,n)}
function defaultAct(){return age()<13?'play':(ACT.post.ok()?'post':'study')}
function ensurePlan(){const n=freeSlots();if(!Array.isArray(S.plan))S.plan=[];while(S.plan.length<n)S.plan.push(defaultAct());S.plan.length=n;S.plan=S.plan.map(a=>ACT[a]&&ACT[a].ok()?a:defaultAct())}
function autoPlan(){
  const n=freeSlots(),a=age(),p=[],can=id=>ACT[id].ok();
  if(n<=0){S.plan=[];return}
  if(S.p.health<40||S.p.mental<35)p.push('rest');
  if(can('part')&&(S.st==='free'||S.money<0)){p.push('part');if(n>=4)p.push('part')}
  if(can('post')){p.push('post');if(n>=3)p.push('post')}
  if(S.st==='school'&&S.p.know<55&&a>=12)p.push('study');
  if(a<13&&S.lesson&&can('lesson'))p.push('lesson');
  if(lover()&&lover().rel<85)p.push('date');
  const fill=a<13?['play','study','friends','lesson']:(S.st==='free'||(S.st==='creator'&&S.money<50000))?['part','practice','talkp','rest']:['practice','talkp','exercise','friends','rest'];
  let i=0;while(p.length<n&&i<30){const c=fill[i++%fill.length];if(can(c))p.push(c)}
  S.plan=p.slice(0,n);
}

// ===== 投稿 =====
function eqBonus(){let t=0;for(const k in S.eq)t+=S.eq[k];return t*1.7}
function postQuality(){
  const g=GENRES[S.genre];let mix=0;for(const s in g.w)mix+=(s==='know'?S.p.know:S.sk[s])*g.w[s];
  const cond=(S.p.health+S.p.mental)/2;
  return clamp(mix*.55+S.tal[S.genre]*.25+eqBonus()+(cond-50)*.15,1,100);
}
function doPost(k){
  const key=S.main,sn=SNS[key],f=S.f[key],q=postQuality(),st=STYLES[S.style]||STYLES.norm;
  const tg=S.trend.g===S.genre?1.8:1,ts=S.trend.s===key?1.4:1;
  const posts=8*k;
  const base=f*(.06+q/500)*sn.reach;
  let disc=(q*q/100)*18*sn.disc*tg*ts*st.disc*R(.5,1.5)*(S.algo>0?.5:1)*(1+Math.min(Math.sqrt(f),700)/120);
  let views=(base+disc)*posts,discV=disc*posts;
  let buzzed=false;
  if(chance((.006+q/5000)*(tg>1?1.5:1)*Math.min(1,k*2))){const m=R(4,16);views+=discV*m;discV*=m+1;buzzed=true}
  let nf=discV*(.005+q/15000)*sn.conv+base*posts*.0008;
  nf*=Math.max(0,1-f/sn.cap);
  if(q<25)nf-=f*.01*k;
  S.f[key]=Math.max(0,f+nf);
  const monet=f>=sn.mon;
  const money=monet?Math.round(views*sn.rpm):0;
  if(money)inc('sns',money);
  S.mo.views+=views;S.mo.newF+=nf;S.mo.posts+=k;S.stats.views+=views;
  ad('mental',-.45*k);ad('health',-.15*k);ad('tal.'+S.genre,.4*k);ad('edit',.35*k);
  for(const s in GENRES[S.genre].w)if(s!=='know')ad(s,.25*k);
  if(buzzed){S.mo.buzz++;S.stats.buzz++;log(`投稿がバズった！ ${num(views)}回再生`,'sns');pop('バズった！','f');snd('buzz');if(S.stats.buzz===1)tl('初めてバズった')}
  const fp=(.0005+st.fl+Math.max(0,60-S.p.rep)/8000)*sn.flame*k*(f>300?1:.2);
  if(chance(fp)&&!S.q.includes('flame')&&!(S.cd.flame!=null&&S.am-S.cd.flame<6)){S.q.push('flame');S.mo.flame++}
  if(S.flags.noSide&&S.st==='work'&&chance(.03*k)&&!S.q.includes('w_fired'))S.q.push('w_fired');
}
function kidChannelTick(k){
  if(!S.kc.on||age()>=13)return;
  S.kc.f+=(30+S.kc.f*.025)*R(.4,1.6)*k;
  if(chance(.02*k)){S.kc.f+=RI(1000,15000);log('家族チャンネルの動画がバズったらしい','sns')}
  if(age()>=6)inc('kc',Math.round(S.kc.f*.02*k*(S.kc.share?3:1)));
  ad('priv',-.4*k);
}
function newTrend(){const gs=Object.keys(GENRES),ss=Object.keys(SNS).filter(x=>x!=='tsubu'||chance(.5));S.trend={g:pick(gs),s:pick(ss),until:S.am+RI(4,9)}}

// ===== 1ターン =====
function turn(){
  if(!S||!S.alive||modalOpen())return;
  const k=S.unit==='week'?.25:1;
  const f0=totalF(),m0=S.money;
  if(S.auto)autoPlan();
  ensurePlan();
  if(age()<6){ad('happy',1*k);ad('tal.'+pick(TALK),.9*k);ad('social',.3*k)}
  else for(const a of S.plan){const ac=ACT[a];if(ac&&ac.ok())ac.f(k)}
  if(S.st==='school'){ad('know',1.1*k);ad('social',.4*k)}
  else if(S.st==='univ'){ad('know',1.3*k);ad('social',.4*k)}
  else if(S.st==='work'){ad('know',.3*k);ad('mental',-.5*k)}
  kidChannelTick(k);
  let monthEnd=true;
  if(S.unit==='week'){S.wk=(S.wk||0)+1;if(S.wk<4)monthEnd=false;else S.wk=0}
  if(monthEnd)endMonth();
  if(!S.alive)return;
  const df=totalF()-f0,dm=S.money-m0;
  if(Math.abs(df)>=1)pop((df>0?'+':'')+num(df)+'人',df>0?'f':'bad');
  if(dm>=1000)setTimeout(()=>pop('+'+yen(dm)),250);
  let ev=null;
  while(S.q.length&&!ev){const e=EV[S.q.shift()];if(e&&(!e.when||e.when()))ev=e}
  if(!ev)ev=rollEvent(k);
  save();render();
  if(ev)showEvent(ev);
}
function endMonth(){
  const a0=age(),lbl=`${S.y}年${S.m}月`;
  S.am++;S.m++;if(S.m>12){S.m=1;S.y++}
  const a=age();
  if(a>=6&&a<18&&S.st==='school')inc('allow',TIERS[S.tier].allow*(a>=13?2:1));
  if(S.st==='work'){inc('job',S.salary);S.salSum+=S.salary}
  if(S.spouse&&S.spouse.inc)inc('family',S.spouse.inc);
  if(a>=65&&S.pension)inc('pension',S.pension);
  if(S.indep)outc('living',livingCost());
  else if(a>=18&&!['univ','school'].includes(S.st))outc('living',30000);
  const kidsN=S.kids.filter(c=>S.am-c.born<22*12).length;if(kidsN)outc('kids',kidsN*35000);
  if(S.debt>0&&S.st!=='univ'&&a>=19){const p=Math.min(S.debt,S.debt>1000000?15000:30000);S.debt-=p;outc('debt',p)}
  if(S.inv>0){S.inv=Math.max(0,S.inv*(1+R(-.035,.045)))}
  if(S.m===4&&S.st==='work')S.salary=Math.round(S.salary*1.02);
  if(S.m===1){S.taxBase=S.yInc;S.yInc=0}
  if(S.m===3&&age()>=18&&S.taxBase>=(S.st==='work'?200000:480000)){if(S.flags.taxAuto){const t=Math.round(S.taxBase*.15);outc('tax',t);log(`確定申告をして税金${yen(t)}を納めた`,'life')}else S.q.push('tax')}
  drift();
  for(const key in S.f){if(!S.open[key])continue;const posted=S.mo.posts>0&&key===S.main;S.f[key]*=posted?.993:.98}
  if(S.rival)S.rival.f=Math.round(S.rival.f*(1+R(.004,.035))+R(5,150));
  if(S.am>=S.trend.until)newTrend();
  if(S.algo>0)S.algo--;
  if(S.pause>0)S.pause--;
  // 予定のイベント
  if(S.st==='univ'&&S.uniEnd&&S.am>=S.uniEnd){S.uniEnd=0;S.q.push('m22')}
  if(S.flags.ronin&&S.am>=S.flags.ronin)S.q.push('ronin2');
  if(S.flags.reemp&&S.am>=S.flags.reemp){delete S.flags.reemp;S.st='retired';S.salary=0;S.job=null;tl('完全に引退した')}
  if(S.flags.cancer==='treat'&&S.flags.cancerEnd&&S.am>=S.flags.cancerEnd){S.flags.cancerEnd=0;S.q.push('h_cured')}
  if(a>=35&&!S.flags.cancer&&chance(clamp(.0006*Math.exp((a-35)*.085),0,.04)/12))S.q.push('h_cancer');
  if(S.money<0&&(S.cd.poorQ==null||S.am-S.cd.poorQ>=12)){S.cd.poorQ=S.am;S.q.push('poor')}
  for(const p of parents()){const pa=p.age0+S.am/12;if(chance(qx(pa,p.role==='母'?'女':'男')/12)){p.alive=false;p.dage=Math.floor(pa);S.deadP=p;S.q.push('l_pdeath')}}
  // 記録
  const tf=totalF();
  S.stats.maxF=Math.max(S.stats.maxF,tf);S.stats.maxM=Math.max(S.stats.maxM,S.money+S.inv-S.debt);

function drift(){
  const a=age(),p=S.p;

  if(a>=45)p.health=clamp(p.health-(a-45)*.006);
  p.mental=clamp(p.mental+(62-p.mental)*.06);
  p.rep=clamp(p.rep+(60-p.rep)*.02);
  p.priv=clamp(p.priv+(85-p.priv)*.01);
  const tgt=35+p.social*.18+p.mental*.22+(S.money<0?-12:4)+(S.spouse?8:0)+Math.min(9,S.kids.length*3)+(S.pet?3:0);
  p.happy=clamp(p.happy+(tgt-p.happy)*.06);
  if(S.money<0){p.health=clamp(p.health-.6);p.mental=clamp(p.mental-1.5)}

}

function qx(a,g){const t=g==='女'?MORT_F:MORT_M;for(let i=1;i<t.length;i++){if(a<t[i][0]){const [a0,q0]=t[i-1],[a1,q1]=t[i];const r=(a-a0)/(a1-a0);return Math.exp(Math.log(q0)+(Math.log(q1)-Math.log(q0))*r)}}return t[t.length-1][1]}

function rollEvent(k){

  for(const id in EV){const e=EV[id];if(!e.w)continue;if(e.once&&S.seen[id])continue;if(e.cd&&S.cd[id]!=null&&S.am-S.cd[id]<e.cd)continue;let ok=true;try{ok=!e.when||e.when()}catch(_){ok=false}if(!ok)continue;if(e.w<1&&spaced)continue;if(chance(Math.min(1,e.w*(e.w>=1?1:.3))*k))hits.push(e)}

function lineChart(cv,pts,label,col,fmt,fixedMax){

  c.fillStyle='#20234a';c.fillRect(0,0,W,Hh);
  let mn=Math.min(0,...pts.map(p=>p[1])),mx=fixedMax||Math.max(1,...pts.map(p=>p[1]));if(mx===mn)mx=mn+1;
  const xm=Math.max(1,pts[pts.length-1][0]);
  const X=x=>l+(x/xm)*(W-l-r),Y=y=>t+(1-(y-mn)/(mx-mn))*(Hh-t-b);
  c.font='11px DotGothic16, sans-serif';c.fillStyle='#aca9d6';c.fillText(label,8,15);
  c.strokeStyle='#454c8c';c.lineWidth=1;
  for(const v of [mn,(mn+mx)/2,mx]){const y=Math.round(Y(v))+.5;c.beginPath();c.moveTo(l,y);c.lineTo(W-r,y);c.stroke();c.fillText(fmt(v),4,y+4)}
  c.fillText('0歳',l-6,Hh-6);c.fillText(Math.round(xm)+'歳',W-r-30,Hh-6);
  c.beginPath();pts.forEach((p,i)=>{const x=X(p[0]),y=Y(p[1]);i?c.lineTo(x,y):c.moveTo(x,y)});c.lineTo(X(pts[pts.length-1][0]),Y(mn));c.lineTo(X(pts[0][0]),Y(mn));c.closePath();c.fillStyle=col+'33';c.fill();
  c.beginPath();pts.forEach((p,i)=>{const x=X(p[0]),y=Y(p[1]);i?c.lineTo(x,y):c.moveTo(x,y)});c.strokeStyle=col;c.lineWidth=2;c.stroke();
  const e=pts[pts.length-1];c.fillStyle=col;c.fillRect(X(e[0])-3,Y(e[1])-3,6,6);
}

function drawPerson(c,x,y,hgt,s){
  // x,y=足元。hgt=身長(px)。s=拡大率
  s=s||1;const a=S?age():20,elder=a>=65,hair=elder?'#c9c9d6':(S?S.look.hair:'#2a1d16'),shirt=S?S.look.shirt:'#ff5c8a',skin='#f2c39d';

  const hx=x-head/2,hy=y-H;
  px(c,(x-bw/2)*1,y-H+head,bw,H-head-Math.round(H*.18),shirt);
  px(c,x-bw/2+1,y-Math.round(H*.18),Math.max(2,bw/2-1),Math.round(H*.18),'#2e3360');px(c,x+1,y-Math.round(H*.18),Math.max(2,bw/2-1),Math.round(H*.18),'#2e3360');
  px(c,hx,hy,head,head,skin);px(c,hx,hy,head,Math.max(2,Math.round(head*.35)),hair);
  if(S&&S.g==='女'&&a>=3)px(c,hx-1,hy,2,head*.9,hair),px(c,hx+head-1,hy,2,head*.9,hair);
  const blink=(fr%60)<3;px(c,hx+head*.25,hy+head*.5,1*s>1?s:1,blink?1:2,'#1a1a2a');px(c,hx+head*.65,hy+head*.5,1*s>1?s:1,blink?1:2,'#1a1a2a');

function turn(){
  if(!S||!S.alive||modalOpen())return;
  ensureV3();
  const k=S.unit==='week'?.25:1;
  const f0=totalF(),m0=S.money;
  const reps=S.unit==='season'?3:1;
  for(let rp=0;rp<reps;rp++){
  if(S.auto)autoPlan();
  ensurePlan();
  if(age()<6){ad('happy',1*k);ad('tal.'+pick(TALK),.9*k);ad('social',.3*k)}
  else S.plan.forEach((a,i)=>{const ac=ACT[a];if(!ac||!ac.ok())return;const os=ac.opts?ac.opts.filter(o=>!o.ok||o.ok()):null;const o=os&&os.length?(os.find(x=>x.k===S.planOpt[i])||os[0]):null;
    if(a==='post'){POPT=o?o.k:'normal';doPost(k);POPT='normal'}else if(o&&o.f)o.f(k);else ac.f(k)});
  if(S.st==='school'){ad('know',1.1*k);ad('social',.4*k)}
  else if(S.st==='univ'){ad('know',1.3*k);ad('social',.4*k)}
  else if(S.st==='work'){ad('know',.3*k);ad('mental',-.5*k)}
  kidChannelTick(k);
  let monthEnd=true;
  if(S.unit==='week'){S.wk=(S.wk||0)+1;if(S.wk<4)monthEnd=false;else S.wk=0}
  if(monthEnd)endMonth();
  if(!S.alive)return;
  if(S.q.length)break;
  }
  const df=totalF()-f0,dm=S.money-m0;
  if(Math.abs(df)>=1)pop((df>0?'+':'')+num(df)+'人',df>0?'f':'bad');
  if(dm>=1000)setTimeout(()=>pop('+'+yen(dm)),250);
  let ev=null;
  while(S.q.length&&!ev){const e=EV[S.q.shift()];if(e&&(!e.when||e.when()))ev=e}
  if(!ev)ev=rollEvent(S.unit==='season'?3:k);
  save();render();
  if(ev)showEvent(ev);
}

let POPT='normal';
function doPost(k){
  const key=S.main,sn=SNS[key],f=S.f[key],st=STYLES[S.style]||STYLES.norm,D=DF();
  const m={q:0,disc:1,posts:1,rpm:1,buzz:1,conv:1,tired:1};
  if(POPT==='short'){m.q=-8;m.disc=1.4*(key==='patto'?1.2:1);m.posts=1.5;m.rpm=.4}
  if(POPT==='big'){const c=Math.round(50000*k*ci());if(S.money>=c){outc('shop',c);m.q=12;m.posts=.5;m.buzz=2.2;m.tired=1.3}}
  if(POPT==='live'){m.posts=.5;m.conv=.8;m.tired=1.2;const tip=Math.round(totalF()*R(.02,.08)*(has('live')?2:1)*ci()*k);if(tip>0)inc('tip',tip);ad('social',.6*k);for(const n of S.friends)rel(n,.2*k)}
  if(POPT==='collab'){m.disc=1.3;m.conv=1.2;if(S.rival&&S.rival.rel>=40){S.f[key]+=Math.round(Math.min(S.rival.f,totalF()*3+1000)*.002*k);rel(S.rival,2*k)}}
  const q=clamp(postQuality()+m.q+(S.subs&&S.subs.editsoft?2:0),1,100);
  const tg=S.trend.g===S.genre?1.8:1,ts=S.trend.s===key?1.4:1;
  const posts=8*k*m.posts;
  const base=f*(.06+q/500)*sn.reach;
  let disc=(q*q/100)*18*sn.disc*tg*ts*st.disc*R(.5,1.5)*(S.algo>0?(has('analytics')?.75:.5):1)*(1+Math.min(Math.sqrt(f),700)/120)*D.disc*(S.cty.disc||1)*(key==='patto'&&has('shorts')?1.25:1)*m.disc*(1+Math.min(.3,(S.flags.lang||0)/100));
  let views=(base+disc)*posts,discV=disc*posts,buzzed=false;
  if(chance((.006+q/5000)*(tg>1?1.5:1)*(1+stN('writer')*.15*staffMul())*m.buzz*Math.min(1,k*2))){const mm=R(4,16);views+=discV*mm;discV*=mm+1;buzzed=true}
  let nf=(discV*(.005+q/15000)*sn.conv+base*posts*.0008)*m.conv;
  nf*=Math.max(0,1-f/sn.cap);
  if(q<25)nf-=f*.01*k;
  S.f[key]=Math.max(0,S.f[key]+nf);
  const money=f>=sn.mon?Math.round(views*sn.rpm*m.rpm*Math.max(.15,S.cty.inc)):0;
  if(money)inc('sns',money);
  S.mo.views+=views;S.mo.newF+=nf;S.mo.posts+=k;S.stats.views+=views;
  const tired=(has('mind')?.7:1)*(stN('manager')?.85:1)*m.tired;
  ad('mental',-.45*k*tired);ad('health',-.15*k*tired);ad('tal.'+S.genre,.4*k);ad('edit',.35*k);
  for(const s in (GENRES[S.genre]||GENRES.talk).w)if(s!=='know')ad(s,.25*k);
  if(buzzed){S.mo.buzz++;S.stats.buzz++;log(`投稿がバズった！ ${num(views)}回再生`,'sns');pop('バズった！','f');snd('buzz');if(S.stats.buzz===1)tl('初めてバズった')}
  const fp=(.0005+st.fl+Math.max(0,60-S.p.rep)/8000)*sn.flame*k*(f>300?1:.2)*D.flame*(S.cty.flame||1)*(POPT==='live'?1.4:1);
  if(chance(fp)&&!S.q.includes('flame')&&!(S.cd.flame!=null&&S.am-S.cd.flame<6)){S.q.push('flame');S.mo.flame++}
  if(S.flags.noSide&&S.st==='work'&&chance(.03*k)&&!S.q.includes('w_fired'))S.q.push('w_fired');

const BK_KEY='nipporia-save-backup@v0.5';
(function(){try{const last=localStorage.getItem('nipporia-ver-last@v0.5');const sv=localStorage.getItem(CFG.save);

function backupInfo(){try{const o=JSON.parse(localStorage.getItem(BK_KEY)||'null');if(!o||!o.data)return null;const d=JSON.parse(o.data);return {ver:o.ver,at:o.at,name:d.name,age:Math.floor((d.am||0)/12),raw:o.data}}catch(e){return null}}
function backupHtml(){const b=backupInfo();if(!b)return '<p class="hint">更新前のセーブの控えはまだない（新しい版が出たときに自動で取られる）。</p>';const dt=new Date(b.at);return `<div class="mch" id="bkBox"><button class="b" type="button" data-act="bkAsk">更新前のセーブに戻す（${esc(b.ver)}・${esc(b.name||'')} ${b.age}歳・${dt.getMonth()+1}/${dt.getDate()}に保管）</button></div>`}

function freeSlots(){const a=age();if(a<6)return 0;let n=({school:a<=12?3:2,univ:3,work:2,creator:4,free:4,retired:4})[S.st]||2;if(S.st==='school'&&S.flags.hs==='online'&&a>=15)n++;if(S.flags.care&&S.am<S.flags.care)n--;return Math.max(1,n)}
function autoPlan(){
  const n=freeSlots(),a=age(),p=[],can=id=>ACT[id]&&ACT[id].ok();
  if(n<=0){S.plan=[];return}
  if(S.p.health<40||S.p.mental<35)p.push('rest');
  if(a<13){const fill=['play','homework','friends','kidvideo','base','chores','lesson'];let i=RI(0,6),g=0;while(p.length<n&&g<30){const c=fill[i++%fill.length];g++;if(can(c)&&(!p.includes(c)||g>14))p.push(c)}S.plan=p.slice(0,n);return}
  if(S.money<0&&can('part'))p.push('part');
  if(can('part')&&S.st==='free'){p.push('part');if(n>=4)p.push('part')}
  if(can('post')){p.push('post');if(n>=3)p.push('post')}
  if(S.st==='school'&&S.p.know<55)p.push('study');
  if(lover()&&lover().rel<85)p.push('date');
  const fill=(S.st==='free'||(S.st==='creator'&&S.money<50000))?['part','practice','talkp','rest']:['practice','talkp','exercise','friends','rest'];
  let i=0;while(p.length<n&&i<30){const c=fill[i++%fill.length];if(can(c))p.push(c)}
  S.plan=p.slice(0,n);
}
function defaultAct(){const a=age();return a<13?pick(['play','homework','friends']):(ACT.post.ok()?'post':'study')}

// ----- 子どもはお金を借りない（足りないときは親が払う） -----
function ad(k,v,cat){if(k==='money'&&cat==='medical'&&v<0&&S.subs&&S.subs.insurance)v=Math.round(v*.3);
  if(!v)return;
  if(k in P_KEYS)S.p[k]=clamp(S.p[k]+v);
  else if(k in SK_KEYS)S.sk[k]=clamp(S.sk[k]+v);
  else if(k==='money'){if(!cat)v=Math.round(v*(S.cty?S.cty.inc:1));
    if(v<0&&age()<18&&S.money+v<0){const cover=-(S.money+v);v=-Math.max(0,S.money);if(cover>0)log(`足りない${yen(cover)}は家族が払ってくれた`,'life')}
    if(v>0)inc(cat==='loss'?'loss':(cat||'ev'),v);else if(v<0)outc(cat||'ev',-v)}
  else if(k==='f'){const key=S.open[S.main]?S.main:'milu';if(!S.open[key])return;S.f[key]=Math.max(0,S.f[key]+v)}
  else if(k.startsWith('tal.')){const t=talKey(k.slice(4));S.tal[t]=clamp((S.tal[t]||0)+v)}
  if(DL)DL[k]=(DL[k]||0)+v;

function kidMoneyPanel(){
  const a=age(),c=Math.max(.2,S.cty.inc),allow=Math.round(TIERS[S.tier].allow*(a>=13?2:1)*S.cty.inc);
  let h=`<h2>おこづかい</h2><div class="kv big2"><span>おこづかいの残り</span><span>${yen(S.money)}</span><span>毎月のおこづかい</span><span>${yen(allow)}</span></div><p class="hint">「お手伝い」の行動でおこづかいを増やせる。18歳になると、家計・住まい・投資などが使えるようになる。</p><h3>おこづかいで買う</h3><div>`;
  for(const g of KIDGOODS){const p=Math.round(g.p*c);h+=`<div class="shop"><div><div>${esc(g.n)} <span class="muted small">${yen(p)}</span></div><div class="muted small">${esc(g.d)}</div></div><button class="b sm" type="button" data-kgood="${g.k}" ${S.money<p?'disabled':''}>買う</button></div>`}
  h+='</div>';
  if(a>=13){h+=`<h3>配信の機材</h3><div>`;for(const [k,e] of Object.entries(EQ)){const lv=S.eq[k],cur=e.t[lv],nx=lv<eqMax()?e.t[lv+1]:null;h+=`<div class="shop"><div><div>${e.n}：${esc(cur[0])}</div>${nx?`<div class="muted small">次：${esc(nx[0])} ${yen(nx[1])}</div>`:''}</div>${nx?`<button class="b sm" type="button" data-buy="${k}" ${S.money<nx[1]?'disabled':''}>買う</button>`:''}</div>`}h+='</div>'}
  if(S.flags.noNet&&a>=13){const pr=Math.round(20000*Math.max(.25,S.cty.inc));h+=`<div class="shop"><div><div>スマホと通信契約</div><div class="muted small">SNSを始められるようになる ${yen(pr)}</div></div><button class="b sm pri" type="button" data-act="buyphone" ${S.money<pr?'disabled':''}>買う</button></div>`}
  const L=S.last;if(L&&(Object.keys(L.inc).length||Object.keys(L.out).length)){h+=`<h3>${esc(L.lbl)}のおこづかい帳</h3><div class="kv">${Object.entries(L.inc).map(([k,v])=>`<span>${INC_LBL[k]||k}</span><span>+${yen(v)}</span>`).join('')}${Object.entries(L.out).map(([k,v])=>`<span>${OUT_LBL[k]||k}</span><span>-${yen(v)}</span>`).join('')}</div>`}
  return h;
}

// ----- 子ども時代の出来事は少し多めに -----
function rollEvent(k){
  if(age()<1)return null;
  const spaced=S.lastEv!=null&&S.am-S.lastEv<(age()<13?1:2);
  const rate=age()<13?.45:.3;
  const hits=[];
  for(const id in EV){const e=EV[id];if(!e.w)continue;if(e.once&&S.seen[id])continue;if(e.cd&&S.cd[id]!=null&&S.am-S.cd[id]<e.cd)continue;let ok=true;try{ok=!e.when||e.when()}catch(_){ok=false}if(!ok)continue;if(e.w<1&&spaced)continue;if(chance(Math.min(1,e.w*(e.w>=1?1:rate))*k))hits.push(e)}
  const ev=hits.length?pick(hits):null;if(ev&&ev.w<1)S.lastEv=S.am;return ev;
}
